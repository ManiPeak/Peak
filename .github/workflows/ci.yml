# Peak 1.0.3 — Unified CI (verify + Windows EXE + Android APK + source ZIP)
# Merged from build-windows.yml + build-android.yml into ONE valid workflow (100-file budget).
# Script paths updated for the 1.0.3 consolidation: scripts/tools.mjs <package-check|prepare-android-assets|release-notes>
name: Peak CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build Next.js app
        run: npm run build

  source-zip:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make source ZIP from tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git archive --format=zip --prefix="Peak-$VERSION/" -o "Peak-$VERSION.zip" HEAD
          ls -lh "Peak-$VERSION.zip"
      - name: Attach source ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Peak-${{ env.VERSION }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true

  build-apk:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      - name: Build Next.js app
        run: npm run build
      - name: Prepare Android assets (libnode + app bundle)
        run: node scripts/tools.mjs prepare-android-assets
      - name: Setup Python 3.11 (old nodejs-mobile-gyp breaks on 3.12+)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-as-latest: true
      - name: Cross-compile better-sqlite3 (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build-android-native.sh arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble APK
        working-directory: android
        run: gradle assembleRelease
      - name: Name APK from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "Peak-$VERSION.apk"
          echo "APK_NAME=Peak-$VERSION.apk" >> "$GITHUB_ENV"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peak-Android-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          overwrite_files: true
          fail_on_unmatched_files: true

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: build-windows-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build EXE (all-in-one script)
        shell: pwsh
        run: ./scripts/build-exe.ps1
      - name: Make Latest names
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $s = @(Get-ChildItem dist -Filter *.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match "(?i)setup" -and $_.Name -notmatch "(?i)latest" })
          $p = @(Get-ChildItem dist -Filter *.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -match "(?i)portable" -and $_.Name -notmatch "(?i)latest" })
          if ($s.Count -gt 0) {
            Copy-Item $s[0].FullName "dist/Peak-Setup-Latest.exe" -Force
            Write-Host ("Latest setup  = " + $s[0].Name + "  -> dist/Peak-Setup-Latest.exe")
          } else {
            Write-Host "::warning::هیچ فایل Setup ای در dist ساخته نشد — Peak-Setup-Latest.exe ساخته نشد."
          }
          if ($p.Count -gt 0) {
            Copy-Item $p[0].FullName "dist/Peak-Portable-Latest.exe" -Force
            Write-Host ("Latest portable = " + $p[0].Name + "  -> dist/Peak-Portable-Latest.exe")
          } else {
            Write-Host "::warning::هیچ فایل Portable ای در dist ساخته نشد — Peak-Portable-Latest.exe ساخته نشد."
          }
      - name: Package check (resources/node/node.exe + .next/BUILD_ID)
        if: always()
        shell: pwsh
        run: |
          node scripts/tools.mjs package-check 2>&1 | Tee-Object -FilePath package-check.txt
          Write-Host "---- package-check.txt ----"
          Get-Content package-check.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
      - name: Upload EXEs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Peak-Windows-EXE
          path: dist/*.exe
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: |
            dist-log.txt
            npm-log.txt
            package-check.txt
          if-no-files-found: ignore
      - name: Release notes + install guide
        if: always()
        shell: pwsh
        run: |
          node scripts/tools.mjs release-notes
          Write-Host "---- release-notes.md (head) ----"
          Get-Content release-notes.md -ErrorAction SilentlyContinue | Select-Object -First 25
      # انتشار: روی main → ریلیز چرخشی با برچسب latest (و make_latest=true)
      #          روی tag (مثل v1.0.3) → ریلیز رسمی و مستقل همان نسخه
      - name: Publish release
        if: always() && hashFiles('dist/Peak-Setup-Latest.exe') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Peak {0} — نسخهٔ رسمی', github.ref_name) || 'Peak — نسخهٔ چرخشی (Latest)' }}
          body_path: release-notes.md
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Peak-Setup-*.exe
            dist/Peak-Portable-*.exe
            release-notes.md
            INSTALL-GUIDE.md
