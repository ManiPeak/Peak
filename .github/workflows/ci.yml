name: Peak CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      PEAK_ABIS: ${{ matrix.abi }}
      OFFICIAL_APK: ${{ github.event_name == 'push' && github.ref_type == 'tag' && matrix.abi == 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      - run: npm run build
      - run: node scripts/tools.mjs prepare-android-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 cmake;3.22.1'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true
      - name: Cross-compile SQLite for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build-android-native.sh "$PEAK_ABIS"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble official APK
        if: env.OFFICIAL_APK == 'true'
        working-directory: android
        env:
          PEAK_KEYSTORE_BASE64: ${{ secrets.PEAK_ANDROID_KEYSTORE_BASE64 }}
          PEAK_STORE_PASSWORD: ${{ secrets.PEAK_ANDROID_STORE_PASSWORD }}
          PEAK_KEY_ALIAS: ${{ secrets.PEAK_ANDROID_KEY_ALIAS }}
          PEAK_KEY_PASSWORD: ${{ secrets.PEAK_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$PEAK_KEYSTORE_BASE64" || -z "$PEAK_STORE_PASSWORD" || -z "$PEAK_KEY_ALIAS" || -z "$PEAK_KEY_PASSWORD" ]]; then
            echo '::error::Official APK requires the four PEAK_ANDROID_* signing secrets (see docs/README.md).'
            exit 1
          fi
          umask 077
          export PEAK_KEYSTORE="$(mktemp "$RUNNER_TEMP/peak-keystore.XXXXXX")"
          trap 'rm -f "$PEAK_KEYSTORE"' EXIT
          printf '%s' "$PEAK_KEYSTORE_BASE64" | base64 --decode > "$PEAK_KEYSTORE"
          unset PEAK_KEYSTORE_BASE64
          gradle --no-daemon assembleRelease -PpeakAbis="$PEAK_ABIS" -PpeakRequireReleaseSigning --stacktrace
      - name: Assemble test APK
        if: env.OFFICIAL_APK != 'true'
        working-directory: android
        run: gradle assembleRelease -PpeakAbis="$PEAK_ABIS" --stacktrace
      - name: Verify and name APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK="$PWD/android/app/build/outputs/apk/release/app-release.apk"
          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/zipalign" -c 4 "$APK"
          BADGING=$("$TOOLS/aapt" dump badging "$APK")
          grep -F "package: name='com.peak.app'" <<< "$BADGING" | grep -F "versionName='$VERSION'"
          grep -Ex "native-code: '$PEAK_ABIS' *" <<< "$BADGING"
          ENTRIES=$(unzip -Z1 "$APK")
          for ENTRY in "lib/$PEAK_ABIS/libnode.so" "lib/$PEAK_ABIS/libpeaknode.so" "lib/$PEAK_ABIS/libc++_shared.so"; do
            grep -Fxq "$ENTRY" <<< "$ENTRIES" || { echo "::error::APK missing $ENTRY"; exit 1; }
          done
          RUNTIME=$(mktemp --suffix=.zip)
          trap 'rm -f "$RUNTIME"' EXIT
          unzip -p "$APK" assets/peak-runtime.zip > "$RUNTIME"
          ENTRIES=$(unzip -Z1 "$RUNTIME")
          for ENTRY in .next/BUILD_ID node_modules/next/dist/bin/next \
            node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            node_modules/minecraft-data/minecraft-data/data/bedrock/common/features.json; do
            grep -Fxq "$ENTRY" <<< "$ENTRIES" || { echo "::error::Runtime archive missing $ENTRY"; exit 1; }
          done
          if [[ "$OFFICIAL_APK" == true ]]; then
            NAME="Peak-$VERSION.apk"
          else
            NAME="Peak-$VERSION-$PEAK_ABIS-test.apk"
          fi
          cp "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Enable KVM for Android emulator
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 14 emulator
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash scripts/build-android-native.sh --smoke-test "$APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: Peak-Android-${{ matrix.abi }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Build EXE
        shell: pwsh
        run: ./scripts/build-exe.ps1
      - name: Verify packaged dependencies
        shell: pwsh
        working-directory: dist/win-unpacked/resources/app
        run: |
          node -e "require('./node_modules/mineflayer')"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Minecraft dependencies cannot be imported' }
      - name: Collect release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          foreach ($kind in @('Setup', 'Portable')) {
            $file = "Peak-$kind-$version.exe"
            if (!(Test-Path "dist/$file")) { throw "Missing $file" }
            Copy-Item "dist/$file" "release/$file"
            Copy-Item "dist/$file" "release/Peak-$kind-Latest.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Peak-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: |
            dist-log.txt
            npm-log.txt
          if-no-files-found: ignore

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build-apk, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: Peak-Android-arm64-v8a
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Peak-Windows-EXE
          path: release
      - name: Prepare release package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [[ "$GITHUB_REF_NAME" == "v$VERSION" ]] || { echo '::error::Tag does not match package.json'; exit 1; }
          test -s "release/Peak-$VERSION.apk"
          git archive --format=zip --prefix="Peak-$VERSION/" -o "release/Peak-$VERSION.zip" HEAD
          node scripts/tools.mjs release-notes
          cp INSTALL-GUIDE.md release/
          (cd release && sha256sum "Peak-$VERSION.apk" > "Peak-$VERSION.apk.sha256")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Peak $GITHUB_REF_NAME" --notes-file release-notes.md release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
