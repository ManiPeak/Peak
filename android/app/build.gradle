/*
 * Peak Android — ماژول اپلیکیشن
 *
 * معماری «عین نسخهٔ PC»: رانتایم Node (libnode از nodejs-mobile) داخل APK +
 * همان سرور Next.js داخل assets + WebView به 127.0.0.1.
 * نسخه به‌صورت خودکار از package.json ریشه خوانده می‌شود تا همیشه هماهنگ بماند.
 */
import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def rootPkg = new JsonSlurper().parse(file("../../package.json"))
def releaseSigning = ["PEAK_KEYSTORE", "PEAK_STORE_PASSWORD", "PEAK_KEY_ALIAS", "PEAK_KEY_PASSWORD"]
        .collectEntries { [(it): System.getenv(it)] }
def hasReleaseKey = releaseSigning.values().every { it }
if (!hasReleaseKey && (releaseSigning.values().any { it } || project.hasProperty("peakRequireReleaseSigning"))) {
    throw new GradleException("Set all four PEAK_* signing variables for an official APK.")
}

android {
    namespace "com.peak.app"
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.peak.app"
        // نام نسخه از package.json
        versionName rootPkg.version.toString()
        versionCode 5
        minSdk 24
        targetSdk 34

        // انتشار: arm64-v8a؛ آزمون شبیه‌ساز: -PpeakAbis=x86_64
        def abis = (findProperty("peakAbis") ?: "arm64-v8a").toString().split(",")
        ndk {
            abiFilters (*abis)
        }

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    androidResources {
        // AAPT's default skips dotfiles/directories, including the entire Next.js build.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*~"
    }

    signingConfigs {
        if (hasReleaseKey) {
            official {
                storeFile file(releaseSigning.PEAK_KEYSTORE)
                storePassword releaseSigning.PEAK_STORE_PASSWORD
                keyAlias releaseSigning.PEAK_KEY_ALIAS
                keyPassword releaseSigning.PEAK_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig = hasReleaseKey ? signingConfigs.official : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            // کتابخانه‌ها هنگام نصب از APK استخراج می‌شوند
            useLegacyPackaging = true
        }
    }
}
